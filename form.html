<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="City Services site to report the pick-up of deceased roadside cats, dogs, and other animals."
    />
    <meta property="og:title" content="Report a Roadside Animal | City Services" />
    <meta
      property="og:description"
      content="Submit a report with the location and details — our team is notified and pickup happens the same day."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://okrayum.github.io/form.html" />
    <meta
      property="og:image"
      content="https://okrayum.github.io/assets/images/skyline.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Report a Roadside Animal | City Services"
    />
    <meta
      name="twitter:description"
      content="Submit a report with the location and details — our team is notified and pickup happens the same day."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/images/favicon.svg"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- Leaflet map (free, no API key). Falls back to cdnjs if unpkg fails. -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      if (typeof L === "undefined") {
        document.write(
          '<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"><\/script>'
        );
      }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Report a Roadside Animal | City Services</title>
  </head>
  <body>
    <!-- Navbar dynamically rendered -->
    <div id="navbar"></div>

    <!-- Header -->
    <header>
      <div class="background-image" role="presentation"></div>
      <h1>Reporting an Animal</h1>
      <p>Submit details for quick action.</p>
    </header>

    <!-- Main Content -->
    <main id="report-page">
      <!-- Map Section -->
      <section id="map-section" aria-labelledby="map-section-heading">
        <h2 id="map-section-heading">Latest Locations</h2>
        <div
          id="map"
          aria-label="Interactive map showing report locations"
        ></div>
      </section>

      <!-- Reporting Form -->
      <section id="form-section" aria-labelledby="form-section-heading">
        <h2 id="form-section-heading">Make a Report</h2>
        <form id="report-form" action="" novalidate>
          <label for="cross-streets">Cross Streets / Address / City:</label>
          <input
            type="text"
            name="cross-streets"
            id="cross-streets"
            required
            aria-required="true"
            aria-describedby="cross-streets-error"
            placeholder="Enter location details"
          />
          <p class="form-error" id="cross-streets-error" aria-live="polite"></p>

          <fieldset id="animal-type-fieldset" aria-describedby="animal-type-error">
            <legend>Type of Animal:</legend>
            <label>
              <input
                type="radio"
                name="animal-type"
                value="dog"
                required
                aria-required="true"
              />
              Dog
            </label>
            <label>
              <input
                type="radio"
                name="animal-type"
                value="cat"
                required
                aria-required="true"
              />
              Cat
            </label>
            <label>
              <input
                type="radio"
                name="animal-type"
                value="other"
                required
                aria-required="true"
              />
              Other
            </label>
          </fieldset>
          <p class="form-error" id="animal-type-error" aria-live="polite"></p>

          <fieldset id="in-road-fieldset" aria-describedby="in-road-error">
            <legend>In Road?</legend>
            <label>
              <input
                type="radio"
                name="in-road"
                value="yes"
                required
                aria-required="true"
              />
              Yes
            </label>
            <label>
              <input
                type="radio"
                name="in-road"
                value="no"
                required
                aria-required="true"
              />
              No
            </label>
          </fieldset>
          <p class="form-error" id="in-road-error" aria-live="polite"></p>

          <label for="description">Brief Description: (optional)</label>
          <textarea
            id="description"
            name="description"
            rows="4"
            aria-required="false"
            placeholder="Provide additional details here"
          ></textarea>

          <button type="submit">Submit Report</button>
        </form>
      </section>

      <!-- Open Reports Section -->
      <section id="reports-section" aria-labelledby="reports-section-heading">
        <h2 id="reports-section-heading">Latest Reports</h2>
        <ul id="reports-list" aria-live="polite">
          <!-- Reports will be dynamically added here -->
        </ul>
      </section>
    </main>

    <!-- Footer dynamically rendered -->
    <div id="footer"></div>

    <script src="js/index.js"></script>
  </body>
</html>
